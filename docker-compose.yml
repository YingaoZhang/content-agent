services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: content_agent
      POSTGRES_USER: content_agent
      POSTGRES_PASSWORD: content_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content_agent -d content_agent"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://content_agent:content_agent@db:5432/content_agent
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
